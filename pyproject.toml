[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrr-geology-conditioned-geostatistics"
version = "0.1.0"
description = "Reusable code and synthetic benchmarks for support-aware geology-conditioned grade geostatistics"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
