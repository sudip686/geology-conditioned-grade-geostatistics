[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nrr-geology-conditioned-geostatistics"
version = "0.2.1"
description = "Reusable code and synthetic benchmarks for support-aware geology-conditioned grade geostatistics"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "joblib==1.3.2",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.4.1.post1",
  "scipy==1.15.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
